name: Render share kit

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "share/templates/**"
      - "share/render.py"
      - ".github/workflows/render.yml"
  workflow_dispatch:

concurrency:
  group: render-share-kit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the renderer
        run: |
          python -m pip install --quiet jinja2 playwright
          python -m playwright install --with-deps chromium
      - name: Render
        run: |
          set +e
          python share/render.py --changed-only
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
      - name: Commit what changed
        run: |
          git config user.name "board-render"
          git config user.email "board-render@users.noreply.github.com"
          git add share/out assets/og.png index.html card.html 404.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Share kit: render $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

{% extends "base.html" %}
{% block body %}
    <span class="eyebrow">Calls on the record</span>
    <h1 class="title xl" style="margin-top: 12px">{{ headline }}</h1>
    <p class="sub">{{ lede }}</p>
    <div class="rows">
      {% for c in items %}
      <div class="row compact" style="grid-template-columns: 110px minmax(0, 1fr) auto; padding: 26px 0">
        <span class="idx">#{{ c.id }}</span>
        <span class="name" style="font-size: 29px; line-height: 1.3">{{ c.text }}</span>
        <span class="chip sm {{ c.status_chip }}">{{ c.status_short }}</span>
        <span class="why" style="font-size: 20px">{{ c.start }}</span>
      </div>
      {% endfor %}
    </div>
{% endblock %}

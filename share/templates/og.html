{% extends "base.html" %}
{% block body %}
    <div class="lead">
      <h1 class="title">{{ headline }}</h1>
      <p class="sub">{{ lede }}</p>
    </div>
    {% if stat %}
    <div class="stat">
      <span class="eyebrow" style="font-size: 14px">The File</span>
      <div class="name" style="margin-top: 8px">{{ stat.name }}</div>
      <div class="pct {{ stat.pct_class }}">{{ stat.pct }}{% if stat.small %}<small>{{ stat.small }}</small>{% endif %}</div>
      <div class="line2">{{ stat.line2 }}</div>
    </div>
    {% endif %}
{% endblock %}
